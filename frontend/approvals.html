<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>WorkGrid - Approvals</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-size: 18px; vertical-align: middle; }
  </style>
</head>
<body class="bg-white text-[#1d1c16] antialiased min-h-screen">
  <div class="pl-[240px] flex flex-col min-h-screen">
    <main class="pt-16 pb-12 flex-1 px-8 max-w-[1140px] w-full mx-auto">
      
      <!-- Top Title -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-[#e9e9e7]">
        <div>
          <div class="text-[12px] text-[#787774] font-medium tracking-wide uppercase mb-1">
            Manager Authorization & Decision Workflow
          </div>
          <h1 class="text-[28px] font-bold text-[#1d1c16] tracking-tight">Approvals</h1>
        </div>
      </div>

      <!-- Status Tabs (Pending / Approved / Rejected) -->
      <div class="flex items-center gap-6 mt-6 border-b border-[#e9e9e7]">
        <button id="tab-pending-btn" class="tab-btn pb-2.5 text-[14px] font-semibold text-[#005da9] border-b-2 border-[#005da9] flex items-center gap-2">
          <span>Pending</span>
          <span id="tab-pending-count" class="px-1.5 py-0.2 rounded text-[11px] font-medium bg-[#f3ede4] text-[#787774]">0</span>
        </button>
        <button id="tab-approved-btn" class="tab-btn pb-2.5 text-[14px] font-medium text-[#787774] hover:text-[#1d1c16] flex items-center gap-2 border-b-2 border-transparent">
          <span>Approved</span>
          <span id="tab-approved-count" class="px-1.5 py-0.2 rounded text-[11px] font-medium bg-[#f3ede4] text-[#787774]">0</span>
        </button>
        <button id="tab-rejected-btn" class="tab-btn pb-2.5 text-[14px] font-medium text-[#787774] hover:text-[#1d1c16] flex items-center gap-2 border-b-2 border-transparent">
          <span>Rejected</span>
          <span id="tab-rejected-count" class="px-1.5 py-0.2 rounded text-[11px] font-medium bg-[#f3ede4] text-[#787774]">0</span>
        </button>
      </div>

      <!-- Master-Detail Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 mt-6">
        <!-- Left: Request List (5 cols) -->
        <div class="lg:col-span-5 border border-[#e9e9e7] rounded-[6px] overflow-hidden bg-white flex flex-col h-[560px]">
          <div class="p-3 bg-[#f8f3ea]/50 border-b border-[#e9e9e7] text-[12px] font-semibold text-[#787774] uppercase tracking-wider">
            Reassignment Queue
          </div>
          <div id="approvals-list-container" class="flex-1 overflow-y-auto divide-y divide-[#e9e9e7]">
            <div class="p-8 text-center text-[#787774] text-[13px]">Loading requests...</div>
          </div>
        </div>

        <!-- Right: Detail Panel (7 cols) -->
        <div class="lg:col-span-7 border border-[#e9e9e7] rounded-[6px] bg-white flex flex-col h-[560px] p-6" id="approval-detail-panel">
          <div class="flex-1 flex flex-col items-center justify-center text-[#787774] text-[13px]">
            <span class="material-symbols-outlined text-[32px] text-[#c0c7d4] mb-2">touch_app</span>
            Select a request on the left to review details and take action.
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- Shared Scripts -->
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <!-- Page Logic -->
  <script src="js/pages/approvals.js"></script>
</body>
</html>
