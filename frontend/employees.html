<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>WorkGrid - Employees</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-size: 18px; vertical-align: middle; }
  </style>
</head>
<body class="bg-white text-[#1d1c16] antialiased min-h-screen">
  <div class="pl-[240px] flex flex-col min-h-screen">
    <main class="pt-16 pb-12 flex-1 px-8 max-w-[1140px] w-full mx-auto">
      
      <!-- Top Title & Action -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-[#e9e9e7]">
        <div>
          <div class="text-[12px] text-[#787774] font-medium tracking-wide uppercase mb-1">
            Workforce Capacity & Team Allocation
          </div>
          <h1 class="text-[28px] font-bold text-[#1d1c16] tracking-tight">Employees</h1>
        </div>
        <button id="open-new-employee-modal-btn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-[4px] bg-[#005da9] hover:bg-[#004884] text-white text-[13px] font-medium transition-colors shadow-xs">
          <span class="material-symbols-outlined text-[16px]">add</span>
          <span>New employee</span>
        </button>
      </div>

      <!-- Filters Row -->
      <div class="flex flex-wrap items-center justify-between gap-4 mt-6 p-3 rounded-[6px] bg-[#f8f3ea]/50 border border-[#e9e9e7]">
        <div class="flex flex-wrap items-center gap-2" id="team-filters">
          <span class="text-[12px] font-semibold text-[#787774] mr-1 uppercase">Team:</span>
          <button class="team-filter-btn px-2.5 py-1 rounded text-[12px] font-medium bg-[#005da9] text-white" data-team="All">All Teams</button>
        </div>

        <div class="flex items-center gap-2" id="workload-filters">
          <span class="text-[12px] font-semibold text-[#787774] mr-1 uppercase">Workload:</span>
          <button class="workload-filter-btn px-2.5 py-1 rounded text-[12px] font-medium bg-[#005da9] text-white" data-workload="All">All</button>
          <button class="workload-filter-btn px-2.5 py-1 rounded text-[12px] font-medium bg-white text-[#787774] border border-[#e9e9e7] hover:bg-[#f3ede4]" data-workload="Free">Free (&lt;20h)</button>
          <button class="workload-filter-btn px-2.5 py-1 rounded text-[12px] font-medium bg-white text-[#787774] border border-[#e9e9e7] hover:bg-[#f3ede4]" data-workload="Active">Active (20-40h)</button>
          <button class="workload-filter-btn px-2.5 py-1 rounded text-[12px] font-medium bg-white text-[#787774] border border-[#e9e9e7] hover:bg-[#f3ede4]" data-workload="Overloaded">Overloaded (&gt;40h)</button>
        </div>
      </div>

      <!-- Employees Table Section -->
      <div class="mt-6 border border-[#e9e9e7] rounded-[4px] overflow-hidden bg-white" id="employees-table-container">
        <div class="p-8 text-center text-[#787774] text-[13px]">Loading employees...</div>
      </div>

    </main>
  </div>

  <!-- New Employee Modal -->
  <div id="new-employee-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-[8px] border border-[#e9e9e7] shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between pb-3 border-b border-[#e9e9e7]">
        <h3 class="text-[16px] font-semibold text-[#1d1c16]">Add New Employee</h3>
        <button id="close-employee-modal-btn" class="text-[#787774] hover:text-[#1d1c16]">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="new-employee-form" class="mt-4 flex flex-col gap-3">
        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Full Name</label>
          <input type="text" name="name" required class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9]" placeholder="e.g. Maya Lin">
        </div>

        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Email</label>
          <input type="email" name="email" required class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9]" placeholder="maya.lin@workgrid.internal">
        </div>

        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Role / Job Title</label>
          <input type="text" name="role" required class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9]" placeholder="e.g. Backend Engineer">
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[12px] font-medium text-[#787774] mb-1">Department</label>
            <select name="departmentId" required id="employee-modal-dept-select" class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9] bg-white">
              <option value="">Select team...</option>
            </select>
          </div>

          <div>
            <label class="block text-[12px] font-medium text-[#787774] mb-1">Weekly Capacity (h)</label>
            <input type="number" name="capacity" value="40" min="1" max="80" class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9]">
          </div>
        </div>

        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Reporting Manager (Optional)</label>
          <select name="managerId" id="employee-modal-manager-select" class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9] bg-white">
            <option value="">None (Reports to Root / Self)</option>
          </select>
        </div>

        <div id="new-employee-form-error" class="hidden text-[12px] text-[#ba1a1a] p-2 bg-[#fff8f7] rounded border border-[#ffdad6]"></div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#e9e9e7] mt-2">
          <button type="button" id="cancel-employee-modal-btn" class="px-3 py-1.5 rounded-[4px] text-[13px] font-medium text-[#787774] hover:bg-[#f3ede4]">
            Cancel
          </button>
          <button type="submit" class="px-3.5 py-1.5 rounded-[4px] bg-[#005da9] hover:bg-[#004884] text-white text-[13px] font-medium">
            Save Employee
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <!-- Page Logic -->
  <script src="js/pages/employees.js"></script>
</body>
</html>
