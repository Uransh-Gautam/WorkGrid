<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>WorkGrid - Projects</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .material-symbols-outlined { font-size: 18px; vertical-align: middle; }
  </style>
</head>
<body class="bg-white text-[#1d1c16] antialiased min-h-screen">
  <div class="pl-[240px] flex flex-col min-h-screen">
    <main class="pt-16 pb-12 flex-1 px-8 max-w-[1140px] w-full mx-auto">
      
      <!-- Top Title & Action -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-[#e9e9e7]">
        <div>
          <div class="text-[12px] text-[#787774] font-medium tracking-wide uppercase mb-1">
            Initiatives & Resource Portfolio
          </div>
          <h1 class="text-[28px] font-bold text-[#1d1c16] tracking-tight">Projects</h1>
        </div>
        <button id="open-new-project-modal-btn" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-[4px] bg-[#005da9] hover:bg-[#004884] text-white text-[13px] font-medium transition-colors shadow-xs">
          <span class="material-symbols-outlined text-[16px]">add</span>
          <span>New project</span>
        </button>
      </div>

      <!-- Projects Table Section -->
      <div class="mt-6 border border-[#e9e9e7] rounded-[4px] overflow-hidden bg-white" id="projects-table-container">
        <div class="p-8 text-center text-[#787774] text-[13px]">Loading projects...</div>
      </div>

    </main>
  </div>

  <!-- New Project Modal -->
  <div id="new-project-modal" class="fixed inset-0 bg-black/40 backdrop-blur-xs z-50 flex items-center justify-center hidden">
    <div class="bg-white rounded-[8px] border border-[#e9e9e7] shadow-xl w-full max-w-md p-6">
      <div class="flex items-center justify-between pb-3 border-b border-[#e9e9e7]">
        <h3 class="text-[16px] font-semibold text-[#1d1c16]">Create New Project</h3>
        <button id="close-project-modal-btn" class="text-[#787774] hover:text-[#1d1c16]">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>

      <form id="new-project-form" class="mt-4 flex flex-col gap-3">
        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Project Name</label>
          <input type="text" name="name" required class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9]" placeholder="e.g. Apollo Gateway V2">
        </div>

        <div>
          <label class="block text-[12px] font-medium text-[#787774] mb-1">Initial Status</label>
          <select name="status" class="w-full px-3 py-1.5 text-[13px] border border-[#e9e9e7] rounded-[4px] focus:outline-none focus:border-[#005da9] bg-white">
            <option value="Planning">Planning</option>
            <option value="In Progress" selected>In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>

        <div id="new-project-form-error" class="hidden text-[12px] text-[#ba1a1a] p-2 bg-[#fff8f7] rounded border border-[#ffdad6]"></div>

        <div class="flex items-center justify-end gap-2 pt-3 border-t border-[#e9e9e7] mt-2">
          <button type="button" id="cancel-project-modal-btn" class="px-3 py-1.5 rounded-[4px] text-[13px] font-medium text-[#787774] hover:bg-[#f3ede4]">
            Cancel
          </button>
          <button type="submit" class="px-3.5 py-1.5 rounded-[4px] bg-[#005da9] hover:bg-[#004884] text-white text-[13px] font-medium">
            Save Project
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Shared Scripts -->
  <script src="js/api.js"></script>
  <script src="js/layout.js"></script>
  <!-- Page Logic -->
  <script src="js/pages/projects.js"></script>
</body>
</html>
